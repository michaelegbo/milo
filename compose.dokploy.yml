services:
  milo:
    build:
      context: .
      args:
        MILO_BUILD_REVISION: ${MILO_BUILD_REVISION:?Set the source commit SHA}
    image: milo-static:${MILO_BUILD_REVISION:?Set the source commit SHA}
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ${MILO_MODEL_DIRECTORY:-/opt/milo/models}:/usr/share/nginx/html/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cpus: "1.0"
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    # Dokploy Domains: milo.seemplifyai.com -> service milo, port 8080.
    # No host port and no server-side inference endpoint are exposed.
