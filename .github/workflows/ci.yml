name: CI

# Verifies every push and pull request, then redeploys the public browser
# edition when main is green. Model-dependent suites (real Kokoro, Whisper and
# Qwen) need multi-gigabyte weights and are not run here; see docs/hosting.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  # Building the browser edition never needs the native inference runtimes.
  NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  verify:
    name: Type-check, build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      bundle: ${{ steps.build.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --include=optional --no-audit --no-fund

      - name: Deterministic server tests
        run: node --test server/*.test.mjs

      - name: Build the browser edition
        id: build
        env:
          VITE_MILO_DEVICE_ONLY: '1'
          VITE_AUDIO_MODEL_BASE: /models/
        run: |
          node scripts/prepare-browser-assets.mjs
          npm run build
          # Vite hashes bundles by content, so this name identifies exactly this
          # source. The deploy job looks for it on the live site.
          bundle=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          test -n "$bundle"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "Built $bundle" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the presets ship with the build
        run: |
          count=$(ls dist/presets/*.mp3 2>/dev/null | wc -l)
          test "$count" -eq 9 || { echo "::error::Expected 9 preset clips, found $count."; exit 1; }

      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: Browser tests that need no models
        # The remaining suites drive real Kokoro/Whisper/Qwen weights or a running
        # device build, so they stay a local and pre-release step.
        run: >
          npx playwright test
          tests/avatar-expression.spec.ts
          tests/conversation-memory.spec.ts
          tests/gpu-info.spec.ts
          tests/streaming-speech.spec.ts
          tests/talking-motion.spec.ts
          --reporter=line

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Redeploy milo.seemplifyai.com
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Verify restricted deployment command contracts
        run: python3 -m unittest discover -s deploy/hostinger -v
      - name: Deploy exact tested main through restricted SSH
        env:
          DEPLOY_KEY: ${{ secrets.MILO_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MILO_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$DEPLOY_HOST" = 191.215.40.99
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/milo_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/milo_deploy" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/milo_deploy" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "root@$DEPLOY_HOST" "deploy $GITHUB_SHA"
      - name: Verify public exact revision and bundle
        env:
          BUNDLE: ${{ needs.verify.outputs.bundle }}
        run: |
          set -euo pipefail
          revision=$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' \
            "https://milo.seemplifyai.com/release.json?expected=$GITHUB_SHA" | jq -r .revision)
          test "$revision" = "$GITHUB_SHA"
          curl -fsS --max-time 30 https://milo.seemplifyai.com/ | grep -F "$BUNDLE" >/dev/null
          printf 'Milo exact revision %s is live on KVM4.\n' "$GITHUB_SHA"
