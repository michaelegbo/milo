worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location = /healthz { default_type text/plain; return 200 'ok\n'; }
        location ^~ /api/ { return 404; }
        location ~ /\. { deny all; }
        location = /release.json { expires -1; }
        location = /models/manifest.json { expires -1; }
        location /models/ { try_files $uri =404; expires 7d; }
        location /runtime/ { try_files $uri =404; expires 7d; }
        location /assets/ { try_files $uri =404; expires 1y; }
        location / { try_files $uri $uri/ /index.html; expires -1; }
    }
}
